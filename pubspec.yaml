name: lazy_asset_generator
description: >
  A Flutter code generator that creates strongly-typed asset access classes
  based on your project’s asset folders. It scans directories under assets/
  and automatically builds typed helpers for cleaner and safer asset usage.
version: 1.6.0
homepage: https://github.com/YannVanneth/asset-generator
repository: https://github.com/YannVanneth/asset-generator
issue_tracker: https://github.com/YannVanneth/asset-generator/issues

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  analyzer: ">=8.1.1 <15.0.0"
  build: ^4.0.0
  build_config: ^1.1.0
  source_gen: ^4.2.0
  glob: ^2.1.3
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.8.0
  build_test: ^3.3.0
  flutter_lints: ^6.0.0
  test: ^1.26.0
