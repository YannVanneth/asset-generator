name: lazy_asset_generator
description: >
  A Flutter code generator that creates strongly-typed asset access classes
  based on your project’s asset folders. It scans the directories defined in
  your pubspec and automatically builds typed helpers for cleaner and safer
  asset usage.
version: 1.4.1
homepage: https://github.com/YannVanneth/asset-generator
repository: https://github.com/YannVanneth/asset-generator
issue_tracker: https://github.com/YannVanneth/asset-generator/issues

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  build: ^4.0.0
  source_gen: ^4.0.0
  glob: ^2.1.3
  path: ^1.9.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  test: ^1.26.0