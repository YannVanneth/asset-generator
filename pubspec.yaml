name: asset_generator
description: >
  A Flutter code generator that creates strongly-typed asset access classes
  based on your project’s asset folders. It scans the directories defined in
  your pubspec and automatically builds typed helpers for cleaner and safer
  asset usage.
version: 0.0.1
homepage: https://github.com/yourusername/asset_generator
repository: https://github.com/YannVanneth/asset_generator
issue_tracker: https://github.com/YannVanneth/asset_generator/issues

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  build: ^2.4.1
  source_gen: ^1.5.0
  glob: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  build_runner: ^2.4.9
  flutter_lints: ^3.0.0
  test: ^1.25.2