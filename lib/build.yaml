targets:
  $default:
    builders:
      asset_generator|asset_generator:
        generate_for:
          - lib/**
        options:
          enabled: true

builders:
  asset_generator:
    import: "package:lazy_asset_generator/builder.dart"
    builder_factories: ["assetFolderBuilder"]
    build_extensions: {".dart": [".g.dart"]}
    auto_apply: dependents
    build_to: source
